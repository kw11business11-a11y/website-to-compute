<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Free Giftcards 🎁</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ff8bd4, #9b5cff, #00f5ff);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      color: white;
    }
    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .container {
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 25px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }
    .shein {background-color: #ff4fa3;}
    .sephora {background-color: #9b5cff;}
    .labubu {background-color: #00c4cc;}
    .more {background-color: #555;}
    footer {
      margin-top: 25px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/120" alt="Profile" class="profile-pic">
    <h1>🎁 Claim Free Giftcards – Shein, Sephora, Labubu</h1>

    <a href="#" class="btn shein">🌸 Claim Shein Giftcard</a>
    <a href="#" class="btn sephora">🛍️ Get Sephora Rewards</a>
    <a href="#" class="btn labubu">🐻 Labubu Giftcard – Free Entry</a>
    <a href="#" class="btn more">🎀 More Giveaways Here</a>

    <footer>
      Affiliate Disclaimer: Some links may earn commissions 💖
    </footer>
  </div>
</body>
</html>
